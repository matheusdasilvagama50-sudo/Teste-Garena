<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garena Dev Tool 🎯</title>
<style>
/* CSS RESET E BASE */
*{ box-sizing:border-box; font-family: 'Courier New', monospace; letter-spacing:-0.5px; }
body{ margin:0; height:100vh; overflow:hidden; background:#000; color:#ff0033; display:flex; align-items:center; justify-content:center; flex-direction: column; }
canvas{ position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

/* PAINEL PRINCIPAL */
.panel{ 
 position:relative; z-index:2; width:360px; 
 background:rgba(10,0,10,.98); border:2px solid #ff0033; border-radius:22px; 
 padding:20px; box-shadow:0 0 25px #ff0033; transition:.4s; text-align: center;
}

.hidden{ display:none }
h2{ text-align:center; margin:5px 0 15px; text-transform: uppercase; font-size: 1.2em; text-shadow: 0 0 10px #ff0033; }
input, button{ width:100%; padding:12px; border-radius:14px; border:1px solid #ff0033; background:#000; color:#ff0033; margin-top:10px; outline: none; }
button{ background:#ff0033; color:#000; font-weight:bold; cursor:pointer; border:none; transition: 0.3s; }
button:hover{ background:#ff4d6d; box-shadow: 0 0 20px #ff4d6d; }

/* ABAS */
.tabs{ display:flex; gap:8px; margin-bottom:12px }
.tab{ flex:1; padding:10px; text-align:center; border:1px solid #ff0033; border-radius:12px; cursor:pointer; font-size: 0.8em; transition: 0.3s; }
.tab.active{ background:#ff0033; color:#000; font-weight: bold; }

/* OPÇÕES */
.option{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size: 0.9em; font-weight: bold;}
.option input[type="checkbox"]{ appearance:none; width:40px; height:20px; background:#300; border-radius:10px; position:relative; cursor:pointer; border: 1px solid #ff0033; }
.option input[type="checkbox"]:checked{ background:#ff0033; }
.option input[type="checkbox"]::before{ content:''; position:absolute; width:14px; height:14px; background:#fff; border-radius:50%; top:2px; left:2px; transition:.3s; }
.option input[type="checkbox"]:checked::before{ left:22px; }

/* CARD DE PERFIL (O QUE VOCÊ PEDIU) */
.profile-card {
    margin-top: 20px;
    background: rgba(20, 0, 0, 0.95);
    border: 1px solid #ff0033;
    border-radius: 15px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
    text-align: left;
}
.profile-pic {
    width: 55px;
    height: 55px;
    border-radius: 12px;
    border: 2px solid #ff0033;
    background: url('https://dicebear.com') center/cover;
}
.profile-info { font-size: 11px; color: #ff0033; line-height: 1.4; }
.profile-info b { color: #fff; font-size: 13px; }
.stat-likes { color: #ffcc00; font-weight: bold; }

/* CONSOLE LOG */
.console{ margin-top:12px; background:#000; border:1px solid #330000; padding:10px; font-size:10px; color:#00ff99; height:100px; overflow:auto; text-align: left; border-radius: 10px; }
</style>
</head>
<body>

<canvas id="rain"></canvas>

<!-- TELA 1: LOGIN -->
<div class="panel" id="loginScreen">
 <h2>Acesso Restrito</h2>
 <p style="font-size: 10px;">GARENA INTERNAL SYSTEMS</p>
 <input id="keyInput" type="password" placeholder="DIGITE A KEY DE ACESSO" style="text-align: center;">
 <button onclick="validarKey()">LOGAR NO SERVIDOR</button>
</div>

<!-- TELA 2: BUSCA ID -->
<div class="panel hidden" id="idScreen">
 <h2>Vincular Conta</h2>
 <p style="font-size: 11px;">Insira o UID para carregar dados</p>
 <input id="idInput" type="number" placeholder="EX: 2549982839" style="text-align: center;">
 <button onclick="vincularID()">BUSCAR JOGADOR</button>
</div>

<!-- TELA 3: PAINEL ATIVO -->
<div class="panel hidden" id="app">
 <h2 id="userDisplay">PAINEL ATIVO</h2>
 
 <div class="tabs">
  <div class="tab active" onclick="tab('aim',this)">Combate</div>
  <div class="tab" onclick="tab('inj',this)">Injetar</div>
 </div>

 <div id="aim">
  <div class="option"><span>Auto-Headshot (V2)</span><input type="checkbox" checked></div>
  <div class="option"><span>Aim-Lock (Cabeça)</span><input type="checkbox" id="headOnly" checked></div>
  <div class="option"><span>Zero Peito (Fix)</span><input type="checkbox" checked></div>
 </div>

 <!-- CARD DE PERFIL -->
 <div class="profile-card" id="playerCard" style="display:none;">
    <div class="profile-pic"></div>
    <div class="profile-info">
        <div>NOME: <b id="pName">BUSCANDO...</b></div>
        <div>ID: <b id="pID">00000000</b></div>
        <div>LIKES: <span class="stat-likes" id="pLikes">---</span></div>
    </div>
 </div>

 <div id="inj" class="hidden">
  <button id="injBtn" onclick="inject()">INJETAR NO MOTOR</button>
  <div class="console hidden" id="log"></div>
 </div>
</div>

<script>
const KEY_CORRETA = "XITIDFF2026";

function validarKey() {
 if(document.getElementById('keyInput').value === KEY_CORRETA) {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('idScreen').classList.remove('hidden');
 } else { alert("KEY INCORRETA!"); }
}

function vincularID() {
 const idValue = document.getElementById('idInput').value;
 if(idValue.length >= 5) {
  // Simula busca de dados
  document.getElementById('pID').innerText = idValue;
  document.getElementById('pName').innerText = "PLAYER_V" + idValue.substring(0,3);
  document.getElementById('pLikes').innerText = (Math.floor(Math.random() * 5000) + 1000) + " 👍";
  document.getElementById('userDisplay').innerText = "VINCULADO: " + idValue;

  document.getElementById('idScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('playerCard').style.display = 'flex';
 } else { alert("ID INVÁLIDO!"); }
}

function tab(id, el) {
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 el.classList.add("active");
 document.getElementById('aim').classList.add("hidden");
 document.getElementById('inj').classList.add("hidden");
 document.getElementById(id).classList.remove("hidden");
}

function inject() {
 const log = document.getElementById("log");
 const btn = document.getElementById("injBtn");
 btn.disabled = true; btn.innerText = "INJETANDO...";
 log.classList.remove("hidden");
 
 const logs = [
  "> Acessando bin/com.dts.freefireth",
  "> Localizando offsets de mira...",
  "> Alterando Bone_Target: 01 (Cabeça)",
  "> Bypass Anti-Cheat Nível 3 Ativado",
  "> SUCESSO: Tiro focado na cabeça!"
 ];
 
 let i = 0;
 const interval = setInterval(() => {
  if(i < logs.length) { log.innerHTML += logs[i] + "<br>"; i++; }
  else { 
    clearInterval(interval); 
    btn.innerText = "CABECARIO ATIVADO ✓"; 
    btn.style.background = "#00ff99"; 
  }
 }, 600);
}

// CHUVA MATRIX
const c=document.getElementById("rain");const ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight;}
resize();onresize=resize;
let drops=[...Array(150)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,l:Math.random()*20,s:Math.random()*5+2}));
(function rain(){
 ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle="rgba(255,0,51,0.4)";
 drops.forEach(d=>{ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x,d.y+d.l);ctx.stroke();d.y+=d.s;if(d.y>c.height){d.y=-20;d.x=Math.random()*c.width;}});
 requestAnimationFrame(rain);
})();
</script>
</body>
</html>
