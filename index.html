<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garena Dev Tool 🎯</title>
<style>
/* ... Mantenha seu CSS original e adicione este abaixo ... */
.profile-card {
    margin-top: 15px;
    background: rgba(15, 0, 0, 0.9);
    border: 1px solid #ff0033;
    border-radius: 15px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 0 10px #ff0033;
}
.profile-pic {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid #ff0033;
    background: url('https://imgur.com') center/cover; /* Foto padrão Garena */
}
.profile-info { font-size: 12px; text-align: left; }
.profile-info b { color: #fff; }
.stat-likes { color: #ffcc00; font-weight: bold; }
</style>
</head>
<body>
<canvas id="rain"></canvas>

<!-- TELA 1 e 2 iguais... -->

<!-- TELA 3 ATUALIZADA -->
<div class="panel hidden" id="app">
 <h2 id="userDisplay">PAINEL ATIVO</h2>
 <div class="tabs">
  <div class="tab active" onclick="tab('aim',this)">Combate</div>
  <div class="tab" onclick="tab('inj',this)">Injetar</div>
 </div>

 <div id="aim">
  <div class="option"><span>Auto-Headshot (Ajuste de FOV)</span><input type="checkbox" id="hs"></div>
  <div class="option"><span>Anti-Ban Bypass</span><input type="checkbox" checked></div>
  <div class="option"><span>Calibração de Mira (Não dar peito)</span><input type="checkbox" id="noChest"></div>
 </div>

 <!-- NOVO CARD DE PERFIL -->
 <div class="profile-card hidden" id="playerCard">
    <div class="profile-pic"></div>
    <div class="profile-info">
        <div>NOME: <b id="pName">GARENA_TESTER</b></div>
        <div>ID: <b id="pID">00000000</b></div>
        <div>LIKES: <span class="stat-likes" id="pLikes">15.432</span></div>
    </div>
 </div>

 <div id="inj" class="hidden">
  <button id="injBtn" onclick="inject()">INJETAR NO MOTOR</button>
  <div class="console hidden" id="log"></div>
 </div>
</div>

<script>
// ... Mantenha sua lógica de Key ...

function vincularID() {
 const idValue = document.getElementById('idInput').value;
 if(idValue.length > 5) {
  // Preenche o Card
  document.getElementById('pID').innerText = idValue;
  document.getElementById('pName').innerText = "PLAYER_" + idValue.substring(0,4);
  document.getElementById('pLikes').innerText = Math.floor(Math.random() * 20000) + " 👍";
  
  document.getElementById('idScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('playerCard').classList.remove('hidden');
 } else { alert("INSIRA UM ID VÁLIDO"); }
}

function inject() {
 const log = document.getElementById("log");
 const btn = document.getElementById("injBtn");
 btn.disabled = true; btn.innerText = "INJETANDO...";
 log.classList.remove("hidden");
 
 // Lógica para o problema de "dar só peito"
 const logs = [
  "> Acessando pasta dts.freefireth...",
  "> Modificando sensibilidade vertical...",
  "> Ajustando 'Aim_Lock' para Head_Bone...",
  "> Bypass Anti-Cheat Nível 3...",
  "> SUCESSO: Mira corrigida para Cabeça!"
 ];
 
 let i = 0;
 const interval = setInterval(() => {
  if(i < logs.length) { log.innerHTML += logs[i] + "<br>"; i++; }
  else { 
    clearInterval(interval); 
    btn.innerText = "MODO CABEÇA ATIVADO"; 
    btn.style.background = "#00ff99"; 
  }
 }, 800);
}
// ... Resto do código da chuva ...
</script>
</body>
</html>
